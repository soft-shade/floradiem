<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your species trees — Floradiem</title>
    <meta name="description" content="Your personal tree of life from Floradiem: every plant, fungus, seaweed and slime mold you have identified, drawn as a circular taxonomy tree with your score beside each species.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#74ac00">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="alternate icon" type="image/png" href="favicon.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <script>window.PD_VER = '20261010d';</script>
    <link rel="stylesheet" href="css/style.css?v=20261010d">
    <link rel="stylesheet" href="css/tree.css?v=20261010d">

    <!-- Firebase: same project and collections as the game (see index.html). -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
      import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
      import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
      const firebaseConfig = {
        apiKey: "AIzaSyA2LKtkUF580OX4zBxOB_rw3UfMcUjg5no",
        authDomain: "worm-game-bdd29.firebaseapp.com",
        projectId: "worm-game-bdd29",
        storageBucket: "worm-game-bdd29.firebasestorage.app",
        messagingSenderId: "645517475620",
        appId: "1:645517475620:web:17217da083f0065730bdb1",
        measurementId: "G-6NGQQXZ01X"
      };
      try {
        const app = initializeApp(firebaseConfig);
        window.PD_AUTH = { auth: getAuth(app), db: getFirestore(app), onAuthStateChanged, doc, getDoc };
        window.dispatchEvent(new Event('pd-auth-ready'));
      } catch (e) { console.warn("Firebase init failed:", e); }
    </script>
  </head>
  <body class="tree-page">
    <header class="topbar">
      <a class="brand" href="index.html" style="color:inherit;text-decoration:none">
        <img src="assets/softshade-tree.svg" alt="Softshade Nature" class="brand-icon">
        <span class="brand-name">Floradiem</span>
      </a>
      <nav class="modes" role="tablist" id="mode-tabs">
        <a class="mode-tab" data-mode="daily" href="tree.html?mode=daily" role="tab">Daily</a>
        <a class="mode-tab" data-mode="unlimited" href="tree.html?mode=unlimited" role="tab">Unlimited</a>
      </nav>
      <div class="top-actions">
        <a class="icon-btn" href="index.html" aria-label="Back to the game" title="Back to the game">&#8592;</a>
      </div>
    </header>

    <main>
      <div class="tree-top">
        <h1 id="tree-title">Your species tree</h1>
        <p class="note" id="tree-sub"></p>
        <span class="spacer"></span>
        <div class="tree-pick" id="tree-pick"></div>
        <div class="tree-tools">
          <button class="btn ghost" id="btn-theme">Light</button>
          <button class="btn ghost" id="btn-svg">Download SVG</button>
          <button class="btn ghost" id="btn-png">Download PNG</button>
        </div>
      </div>
      <div class="tree-wrap" id="tree-wrap">
        <div class="tree-empty" id="tree-empty" hidden></div>
        <svg id="tree-svg" xmlns="http://www.w3.org/2000/svg" hidden></svg>
        <div class="zoom" id="zoom" hidden>
          <button id="z-in" aria-label="Zoom in">+</button>
          <button id="z-out" aria-label="Zoom out">−</button>
          <button id="z-fit" aria-label="Fit" title="Fit">⤢</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <p class="tree-foot">Each species you identify in Floradiem is added here with the points you scored. A tree holds 250 species;
        the next one starts a new tree. Sign in to the game to keep your trees across devices. Drag to pan, scroll or pinch to zoom.</p>
    </main>

    <script src="js/common.js?v=20261010d"></script>
    <script src="js/tree.js?v=20261010d"></script>
  </body>
</html>
